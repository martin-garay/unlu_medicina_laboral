acing" textLength="261.7202" x="271.71" y="553.8797">de negocio. En el repo actual existe una</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.4897" x="271.71" y="569.0125">implementacion null/no-op.</text></g><g class="entity" data-qualified-name="GMN82" data-source-line="139" id="ent0083"><path d="M1975.32,347.79 L1975.32,403.1884 A0,0 0 0 0 1975.32,403.1884 L2298.3796,403.1884 A0,0 0 0 0 2298.3796,403.1884 L2298.3796,357.79 L2288.3796,347.79 L2149.11,347.79 L2167.13,275.52 L2141.11,347.79 L1975.32,347.79 A0,0 0 0 0 1975.32,347.79" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2288.3796,347.79 L2288.3796,357.79 L2298.3796,357.79 L2288.3796,347.79" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.519" x="1981.32" y="364.8569">Contrato por paso del flujo conversacional.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.3447" x="1981.32" y="379.9897">Los handlers concretos se registran en</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.0596" x="1981.32" y="395.1225">AppServiceProvider y son resueltos por orden.</text></g><g class="entity" data-qualified-name="GMN85" data-source-line="145" id="ent0086"><path d="M1559.84,6 L1559.84,29.7 L1524.6,33.7 L1559.84,37.7 L1559.84,61.3984 A0,0 0 0 0 1559.84,61.3984 L1873.8542,61.3984 A0,0 0 0 0 1873.8542,61.3984 L1873.8542,16 L1863.8542,6 L1559.84,6 A0,0 0 0 0 1559.84,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1863.8542,6 L1863.8542,16 L1873.8542,16 L1863.8542,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.0142" x="1565.84" y="23.0669">El webhook sigue siendo la frontera principal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.7363" x="1565.84" y="38.1997">del canal WhatsApp. La l&#243;gica de flujo ya se</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.3706" x="1565.84" y="53.3325">apoya en StepResult, handlers y servicios.</text></g><g class="entity" data-qualified-name="GMN88" data-source-line="151" id="ent0089"><path d="M1812.04,231.39 L1812.04,286.7884 A0,0 0 0 0 1812.04,286.7884 L2077.6469,286.7884 A0,0 0 0 0 2077.6469,286.7884 L2077.6469,241.39 L2067.6469,231.39 L1948.85,231.39 L1944.85,154.43 L1940.85,231.39 L1812.04,231.39 A0,0 0 0 0 1812.04,231.39" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2067.6469,231.39 L2067.6469,241.39 L2077.6469,241.39 L2067.6469,231.39" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.7134" x="1818.04" y="248.4569">Todavia conviven handlers actuales,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.6069" x="1818.04" y="263.5897">placeholders y algunos transicionales</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.2822" x="1818.04" y="278.7225">como compatibilidad incremental.</text></g><!--link Conversacion to ConversacionMensaje--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="association" data-source-line="82" id="lnk31"><path codeLine="82" d="M1168,610.24 C1129.65,646.2 1081.02,691.8 1042.67,727.76" fill="none" id="Conversacion-ConversacionMensaje" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.0229" x="1106.35" y="677.6369">mensajes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.271" 