l/no-op.</text></g><g class="entity" data-qualified-name="GMN85" data-source-line="149" id="ent0086"><path d="M1832.32,347.79 L1832.32,403.1884 A0,0 0 0 0 1832.32,403.1884 L2155.3796,403.1884 A0,0 0 0 0 2155.3796,403.1884 L2155.3796,357.79 L2145.3796,347.79 L1926.05,347.79 L1731.71,275.52 L1918.05,347.79 L1832.32,347.79 A0,0 0 0 0 1832.32,347.79" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2145.3796,347.79 L2145.3796,357.79 L2155.3796,357.79 L2145.3796,347.79" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.519" x="1838.32" y="364.8569">Contrato por paso del flujo conversacional.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.3447" x="1838.32" y="379.9897">Los handlers concretos se registran en</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.0596" x="1838.32" y="395.1225">AppServiceProvider y son resueltos por orden.</text></g><g class="entity" data-qualified-name="GMN88" data-source-line="155" id="ent0089"><path d="M1050.84,6 L1050.84,29.7 L1015.6,33.7 L1050.84,37.7 L1050.84,61.3984 A0,0 0 0 0 1050.84,61.3984 L1364.8542,61.3984 A0,0 0 0 0 1364.8542,61.3984 L1364.8542,16 L1354.8542,6 L1050.84,6 A0,0 0 0 0 1050.84,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1354.8542,6 L1354.8542,16 L1364.8542,16 L1354.8542,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.0142" x="1056.84" y="23.0669">El webhook sigue siendo la frontera principal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.7363" x="1056.84" y="38.1997">del canal WhatsApp. La l&#243;gica de flujo ya se</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdju