---
- name: Configure TLS and validate HTTPS
  hosts: app_servers
  gather_facts: true
  become: true
  roles:
    - role: tls
      when: tls_enabled
    - role: apache
      apache_document_root: "{{ application_document_root }}"
      apache_install_runtime_probe: false
  post_tasks:
    - name: Validate HTTP to HTTPS redirect
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --connect-timeout
          - "10"
          - --max-time
          - "30"
          - --noproxy
          - "*"
          - --header
          - "Host: {{ application_hostname }}"
          - http://127.0.0.1/up
      register: tls_http_redirect
      changed_when: false
      failed_when: >-
        tls_http_redirect.rc != 0 or tls_http_redirect.stdout != '301'
      when:
        - tls_enabled
        - not ansible_check_mode

    - name: Validate trusted Laravel HTTPS endpoint
      ansible.builtin.command:
        argv: >-
          {{
            [
              'curl', '--silent', '--show-error', '--fail',
              '--output', '/dev/null', '--write-out', '%{http_code}',
              '--connect-timeout', '10', '--max-time', '30',
              '--noproxy', '*'
            ]
            + (
              ['--cacert', tls_ca_certificate_path]
              if tls_provider == 'local_ca'
              else []
            )
            + ['https://' ~ application_hostname ~ '/up']
          }}
      register: tls_https_health
      changed_when: false
      failed_when: >-
        tls_https_health.rc != 0 or tls_https_health.stdout != '200'
      when:
        - tls_enabled
        - not ansible_check_mode
