---
- name: Deploy Laravel application
  hosts: app_servers
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/vault.yml
  vars:
    application_database_inventory_host: "{{ groups['db_servers'] | first }}"
    application_db_host: >-
      {{ '127.0.0.1' if application_database_inventory_host == inventory_hostname
      else hostvars[application_database_inventory_host].ansible_host }}
  roles:
    - role: application

- name: Point Apache to the active Laravel release
  hosts: app_servers
  gather_facts: false
  become: true
  roles:
    - role: apache
      apache_document_root: "{{ application_document_root }}"
      apache_install_runtime_probe: false

- name: Validate deployed Laravel health endpoint
  hosts: app_servers
  gather_facts: false
  become: false
  tasks:
    - name: Request Laravel health endpoint
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --connect-timeout
          - "10"
          - --max-time
          - "30"
          - --noproxy
          - "*"
          - --header
          - "Host: {{ application_hostname }}"
          - http://127.0.0.1/up
      register: application_http_health
      changed_when: false
      failed_when: >-
        application_http_health.rc != 0
        or application_http_health.stdout not in
        (['200', '301'] if tls_enabled | default(false) | bool else ['200'])
      when: not ansible_check_mode
