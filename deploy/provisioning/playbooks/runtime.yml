---
- name: Install PHP-FPM and Apache runtime
  hosts: app_servers
  gather_facts: true
  become: true
  roles:
    - role: php
    - role: apache
      apache_install_runtime_probe: "{{ runtime_probe_enabled | default(true) }}"
      apache_document_root: >-
        {{ application_root ~ '/placeholder/public'
           if (runtime_probe_enabled | default(true))
           else application_document_root }}

- name: Validate HTTP through Apache and PHP-FPM
  hosts: app_servers
  gather_facts: false
  become: false
  tasks:
    - name: Request temporary runtime probe
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --fail
          - --connect-timeout
          - "10"
          - --max-time
          - "30"
          - --noproxy
          - "*"
          - --header
          - "Host: {{ application_hostname }}"
          - http://127.0.0.1/
      register: runtime_probe
      changed_when: false
      failed_when: >-
        runtime_probe.rc != 0
        or 'medicina-laboral-runtime-ok' not in runtime_probe.stdout
      when:
        - runtime_probe_enabled | default(true)
        - not ansible_check_mode
