---
- name: Register bootstrap target from inventory variables
  hosts: app_servers
  gather_facts: false
  connection: local
  become: false
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml
  tasks:
    - name: Probe non-interactive bootstrap SSH alias
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=10
          - "{{ bootstrap_access_initial_host }}"
          - "true"
      changed_when: false
      failed_when: false
      register: bootstrap_access_ssh_probe

    - name: Require non-interactive bootstrap SSH alias
      ansible.builtin.assert:
        that:
          - bootstrap_access_ssh_probe.rc == 0
        fail_msg: >-
          The SSH alias {{ bootstrap_access_initial_host }} must work without
          interactive passwords before running bootstrap. Configure key-based
          access on the bastion, then retry this playbook.

    - name: Register runtime bootstrap host
      ansible.builtin.add_host:
        name: >-
          {{ bootstrap_access_inventory_name | default('bootstrap-target') }}
        groups:
          - bootstrap_targets
        ansible_host: "{{ bootstrap_access_initial_host }}"
        ansible_user: "{{ bootstrap_access_initial_user }}"
        ansible_ssh_private_key_file: >-
          {{ bootstrap_access_initial_ssh_private_key_file }}
        ansible_become_method: >-
          {{ bootstrap_access_initial_become_method | default('sudo') }}
        ansible_become_user: >-
          {{ bootstrap_access_initial_become_user | default('root') }}
        ansible_become_password: >-
          {{ bootstrap_access_initial_become_password | default('') }}
        bootstrap_access_enabled: >-
          {{ bootstrap_access_enabled | default(false) }}
        bootstrap_access_use_become: >-
          {{ bootstrap_access_use_become | default(false) }}
        bootstrap_access_public_keys: >-
          {{ bootstrap_access_public_keys | default([]) }}
        bootstrap_access_user_name: >-
          {{ bootstrap_access_user_name | default(deploy_user_name) }}
        bootstrap_access_user_group: >-
          {{ bootstrap_access_user_group | default(deploy_user_group) }}
        bootstrap_access_passwordless_sudo: >-
          {{
            bootstrap_access_passwordless_sudo
            | default(deploy_user_passwordless_sudo)
          }}
      no_log: true

- name: Bootstrap operational SSH access
  hosts: bootstrap_targets
  gather_facts: false
  become: "{{ bootstrap_access_use_become | default(false) }}"
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml
  vars:
    bootstrap_access_target_user_name: >-
      {{ bootstrap_access_user_name | default('deploy') }}
    bootstrap_access_target_user_group: >-
      {{ bootstrap_access_user_group | default(
        bootstrap_access_target_user_name
      ) }}
    bootstrap_access_target_user_shell: >-
      {{ bootstrap_access_user_shell | default('/bin/bash') }}
    bootstrap_access_target_public_keys: >-
      {{ bootstrap_access_public_keys | default([]) }}
    bootstrap_access_target_passwordless_sudo: >-
      {{ bootstrap_access_passwordless_sudo | default(true) }}
  tasks:
    - name: Require explicit bootstrap opt-in
      ansible.builtin.assert:
        that:
          - bootstrap_access_enabled | default(false) | bool
        fail_msg: >-
          bootstrap_access_enabled must be true. This playbook intentionally
          changes SSH and sudo access and should only be used during bootstrap.

    - name: Require at least one authorized key
      ansible.builtin.assert:
        that:
          - bootstrap_access_target_public_keys | length > 0
        fail_msg: >-
          bootstrap_access_public_keys must include at least one SSH public key.

    - name: Require become password when bootstrapping through su
      ansible.builtin.assert:
        that:
          - ansible_become_password is defined
          - ansible_become_password | length > 0
        fail_msg: >-
          ansible_become_password must be provided, usually through an encrypted
          Vault variable, when bootstrap uses become_method=su.
      no_log: true
      when:
        - bootstrap_access_use_become | default(false) | bool
        - ansible_become_method | default('sudo') == 'su'

    - name: Ensure sudo is installed for operational access
      raw: |
        if ! command -v sudo >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y sudo
        fi
      changed_when: false
      tags:
        - skip_ansible_lint

    - name: Provision operational user and SSH access
      raw: |
        set -eu

        user={{ bootstrap_access_target_user_name | quote }}
        group={{ bootstrap_access_target_user_group | quote }}
        shell={{ bootstrap_access_target_user_shell | quote }}
        home="/home/$user"
        passwordless_sudo={{ bootstrap_access_target_passwordless_sudo |
          quote }}

        if ! getent group "$group" >/dev/null 2>&1; then
          groupadd --system "$group"
        fi

        if id -u "$user" >/dev/null 2>&1; then
          usermod --gid "$group" --append --groups sudo --shell "$shell" "$user"
        else
          useradd \
            --gid "$group" \
            --groups sudo \
            --shell "$shell" \
            --create-home \
            "$user"
        fi

        passwd -l "$user" >/dev/null 2>&1 || true

        install -d -o "$user" -g "$group" -m 0700 "$home/.ssh"
        cat > "$home/.ssh/authorized_keys" <<'AUTHORIZED_KEYS'
        {{ bootstrap_access_target_public_keys | unique | join('\n') }}
        AUTHORIZED_KEYS
        chown "$user:$group" "$home/.ssh/authorized_keys"
        chmod 0600 "$home/.ssh/authorized_keys"

        case "$passwordless_sudo" in
          True|true|1|yes|Yes)
            printf '%s ALL=(ALL:ALL) NOPASSWD: ALL\n' "$user" \
              > "/etc/sudoers.d/$user"
            chown root:root "/etc/sudoers.d/$user"
            chmod 0440 "/etc/sudoers.d/$user"
            visudo -cf "/etc/sudoers.d/$user"
            ;;
          *)
            rm -f "/etc/sudoers.d/$user"
            ;;
        esac
      changed_when: true
      tags:
        - skip_ansible_lint
