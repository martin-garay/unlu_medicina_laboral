---
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
    operating_system_family: debian
    operating_system_version: "13"
    web_server: apache
    web_server_version: "2.4"
    php_version: "8.4"
    postgresql_version: "17"
    application_hostname: medicina-laboral.test
    application_url: "https://{{ application_hostname }}"
    deploy_user_passwordless_sudo: true
    deploy_user_public_keys:
      - >-
        {{ lookup('ansible.builtin.file', inventory_dir +
        '/../../../../.local/ssh/deploy_ed25519.pub') }}
  children:
    app_servers:
      hosts:
        medicina-app:
          ansible_host: 192.168.56.11
          ansible_ssh_private_key_file: >-
            {{ inventory_dir }}/../../../.vagrant/machines/medicina-app/virtualbox/private_key
    db_servers:
      hosts:
        medicina-db:
          ansible_host: 192.168.56.12
          ansible_ssh_private_key_file: >-
            {{ inventory_dir }}/../../../.vagrant/machines/medicina-db/virtualbox/private_key
