---
all:
  vars:
    ansible_user: deploy
    ansible_ssh_common_args: >-
      -o IdentitiesOnly=yes
      -o StrictHostKeyChecking=accept-new
    operating_system_family: debian
    operating_system_version: "13"
    web_server: apache
    web_server_version: "2.4"
    php_version: "8.4"
    postgresql_version: "17"

    ansible_ssh_private_key_file: >-
      {{ inventory_dir }}/../../../.local/ssh/deploy_ed25519

    application_hostname: avisos-pruebas.unlu.edu.ar
    application_url: "https://{{ application_hostname }}"
    application_release_id: "testing-2026-08-24-01"
    application_source_strategy: git
    application_transfer_strategy: archive
    # Testing has no outbound HTTPS to Packagist/GitHub. Build vendor on PC Uni
    # from this release's exact Git checkout and synchronize it to the matching
    # remote release instead of downloading dependencies on the server.
    application_composer_install_local: true
    application_git_repo: https://github.com/martin-garay/unlu_medicina_laboral.git
    application_git_ref: "{{ application_release_id }}"

    tls_enabled: true
    tls_provider: local_ca
    # Testing conserva los controles institucionales existentes hasta definir
    # reglas completas para SSH, hardening, monitoreo y servicios publicados.
    security_enabled: false
    firewall_enabled: false

    deploy_user_passwordless_sudo: true
    deploy_user_public_keys:
      - >-
        {{ lookup('ansible.builtin.file', inventory_dir +
        '/../../../.local/ssh/deploy_ed25519.pub') }}

    # Bootstrap inicial: usa la cuenta humana mgaray y su para crear deploy.
    # La password real se guarda cifrada en group_vars/vault.yml.
    bootstrap_access_enabled: true
    bootstrap_access_use_become: true
    bootstrap_access_inventory_name: avisos-testing-bootstrap
    bootstrap_access_initial_host: unlu-medicina-testing
    bootstrap_access_initial_user: mgaray
    bootstrap_access_initial_ssh_private_key_file: ~/.ssh/id_ed25519
    bootstrap_access_initial_become_method: su
    bootstrap_access_initial_become_user: root
    bootstrap_access_initial_become_password: >-
      {{ vault_testing_bootstrap_become_password | default('') }}
    bootstrap_access_public_keys: "{{ deploy_user_public_keys }}"

    ssh_allowed_networks: []
    web_allowed_networks:
      - 0.0.0.0/0
    postgresql_allowed_networks: []

  children:
    app_servers:
      hosts:
        avisos-testing:
          ansible_host: unlu-medicina-testing
          application_release_id: "testing-2026-08-24-01"
          security_enabled: false
          firewall_enabled: false
          postgresql_listen_addresses:
            - 127.0.0.1
    db_servers:
      hosts:
        avisos-testing:
    bootstrap_targets:
      hosts: {}
