---
- name: Install PHP packages
  ansible.builtin.apt:
    name: "{{ php_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Laravel PHP settings
  ansible.builtin.template:
    src: versions/php-8.4/99-medicina-laboral.ini.j2
    dest: "{{ php_fpm_conf_dir }}/99-medicina-laboral.ini"
    owner: root
    group: root
    mode: "0644"
  notify: Restart PHP-FPM

- name: Ensure PHP-FPM is enabled and running
  ansible.builtin.service:
    name: "{{ php_fpm_service }}"
    enabled: true
    state: started
  when: not ansible_check_mode

