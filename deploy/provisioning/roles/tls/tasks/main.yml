---
- name: Collect service state before TLS changes
  ansible.builtin.service_facts:

- name: Validate TLS provider
  ansible.builtin.assert:
    that:
      - tls_provider in ['local_ca', 'provided']

- name: Create local TLS material directory
  ansible.builtin.file:
    path: "{{ tls_local_directory }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  when: tls_provider == 'local_ca'

- name: Generate local CA private key
  ansible.builtin.command:
    argv: [openssl, genrsa, -out, "{{ tls_local_ca_key }}", "4096"]
    creates: "{{ tls_local_ca_key }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  when: tls_provider == 'local_ca'

- name: Generate local CA certificate
  ansible.builtin.command:
    argv: [openssl, req, -x509, -new, -key, "{{ tls_local_ca_key }}", -sha256, -days, "3650", -subj, /CN=Medicina-Laboral-Vagrant-CA-v2, -addext, "basicConstraints=critical,CA:TRUE", -addext, "keyUsage=critical,keyCertSign,cRLSign", -addext, "subjectKeyIdentifier=hash", -out, "{{ tls_local_ca_certificate }}"]
    creates: "{{ tls_local_ca_certificate }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  when: tls_provider == 'local_ca'

- name: Generate server private key
  ansible.builtin.command:
    argv: [openssl, genrsa, -out, "{{ tls_local_server_key }}", "2048"]
    creates: "{{ tls_local_server_key }}"
  delegate_to: localhost
  become: false
  check_mode: false
  when: tls_provider == 'local_ca'

- name: Generate server CSR
  ansible.builtin.command:
    argv: [openssl, req, -new, -key, "{{ tls_local_server_key }}", -subj, "/CN={{ application_hostname }}", -addext, "subjectAltName=DNS:{{ application_hostname }}", -addext, "basicConstraints=critical,CA:FALSE", -addext, "keyUsage=critical,digitalSignature,keyEncipherment", -addext, "extendedKeyUsage=serverAuth", -out, "{{ tls_local_server_csr }}"]
    creates: "{{ tls_local_server_csr }}"
  delegate_to: localhost
  become: false
  check_mode: false
  when: tls_provider == 'local_ca'

- name: Write server certificate extensions
  ansible.builtin.copy:
    dest: "{{ tls_local_server_extensions }}"
    mode: "0600"
    content: |
      [server_cert]
      basicConstraints=critical,CA:FALSE
      keyUsage=critical,digitalSignature,keyEncipherment
      extendedKeyUsage=serverAuth
      subjectAltName=DNS:{{ application_hostname }}
  delegate_to: localhost
  become: false
  check_mode: false
  when: tls_provider == 'local_ca'

- name: Sign server certificate with local CA
  ansible.builtin.command:
    argv: [openssl, x509, -req, -in, "{{ tls_local_server_csr }}", -CA, "{{ tls_local_ca_certificate }}", -CAkey, "{{ tls_local_ca_key }}", -CAcreateserial, -days, "825", -sha256, -extfile, "{{ tls_local_server_extensions }}", -extensions, server_cert, -out, "{{ tls_local_server_certificate }}"]
    creates: "{{ tls_local_server_certificate }}"
  delegate_to: localhost
  become: false
  check_mode: false
  when: tls_provider == 'local_ca'

- name: Validate generated local TLS material
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ tls_local_server_key }}"
    - "{{ tls_local_server_certificate }}"
    - "{{ tls_local_ca_certificate }}"
  register: tls_local_generated_files
  delegate_to: localhost
  become: false
  when: tls_provider == 'local_ca'

- name: Require generated local TLS material
  ansible.builtin.assert:
    that:
      - tls_local_generated_files.results | map(attribute='stat.exists') | min
    fail_msg: >-
      Local TLS material could not be generated under {{ tls_local_directory }}.
      Verify that openssl is installed on the Ansible control node.
  delegate_to: localhost
  become: false
  when: tls_provider == 'local_ca'

- name: Inspect TLS target directories
  ansible.builtin.stat:
    path: "{{ item.path | dirname }}"
  loop:
    - name: private_key
      path: "{{ tls_private_key_path }}"
    - name: certificate
      path: "{{ tls_certificate_path }}"
    - name: ca_certificate
      path: "{{ tls_ca_certificate_path }}"
  register: tls_target_directories
  when: tls_provider == 'local_ca'

- name: Track TLS target directory state
  ansible.builtin.set_fact:
    tls_private_key_directory_exists: >-
      {{
        tls_target_directories.results
        | selectattr('item.name', 'equalto', 'private_key')
        | map(attribute='stat.isdir')
        | first
        | default(false)
      }}
    tls_certificate_directory_exists: >-
      {{
        tls_target_directories.results
        | selectattr('item.name', 'equalto', 'certificate')
        | map(attribute='stat.isdir')
        | first
        | default(false)
      }}
    tls_ca_certificate_directory_exists: >-
      {{
        tls_target_directories.results
        | selectattr('item.name', 'equalto', 'ca_certificate')
        | map(attribute='stat.isdir')
        | first
        | default(false)
      }}
  when: tls_provider == 'local_ca'

- name: Report TLS target directories missing during check mode
  ansible.builtin.debug:
    msg: >-
      Would create {{ item.item.path | dirname }} during apply; TLS copy is
      skipped in check mode because the target directory does not exist yet.
  loop: "{{ tls_target_directories.results }}"
  when:
    - tls_provider == 'local_ca'
    - ansible_check_mode
    - not (item.stat.isdir | default(false))

- name: Ensure TLS target directories exist
  ansible.builtin.file:
    path: "{{ item.path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ tls_private_key_path }}"
      mode: "0700"
    - path: "{{ tls_certificate_path }}"
      mode: "0755"
    - path: "{{ tls_ca_certificate_path }}"
      mode: "0755"
  when:
    - tls_provider == 'local_ca'
    - not ansible_check_mode

- name: Install TLS private key
  ansible.builtin.copy:
    src: "{{ tls_local_server_key }}"
    dest: "{{ tls_private_key_path }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - tls_provider == 'local_ca'
    - not ansible_check_mode or tls_private_key_directory_exists
  no_log: true
  notify: Reload Apache after TLS change

- name: Install TLS certificate
  ansible.builtin.copy:
    src: "{{ tls_local_server_certificate }}"
    dest: "{{ tls_certificate_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - tls_provider == 'local_ca'
    - not ansible_check_mode or tls_certificate_directory_exists
  notify: Reload Apache after TLS change

- name: Install local CA trust
  ansible.builtin.copy:
    src: "{{ tls_local_ca_certificate }}"
    dest: "{{ tls_ca_certificate_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Update CA certificates
  when:
    - tls_provider == 'local_ca'
    - not ansible_check_mode or tls_ca_certificate_directory_exists

- name: Resolve local TLS hostname inside Vagrant host
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.0\\.1\\s+{{ application_hostname | regex_escape }}$"
    line: "127.0.0.1 {{ application_hostname }}"
    state: present
  when: tls_provider == 'local_ca'

- name: Apply local CA trust before HTTPS checks
  ansible.builtin.meta: flush_handlers

- name: Validate provided certificate files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ tls_certificate_path }}"
    - "{{ tls_private_key_path }}"
  register: tls_provided_files
  failed_when: not tls_provided_files.stat.exists
  when: tls_provider == 'provided'
