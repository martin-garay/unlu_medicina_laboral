---
- name: Validate application source strategy
  ansible.builtin.assert:
    that:
      - application_source_strategy in ['local', 'git']
    fail_msg: "Unsupported application source strategy: {{ application_source_strategy }}"

- name: Install Composer
  ansible.builtin.apt:
    name: composer
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install rsync for application synchronization
  ansible.builtin.apt:
    name: rsync
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check remote rsync availability
  ansible.builtin.command:
    argv: [rsync, --version]
  register: application_remote_rsync
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report missing remote rsync during check mode
  ansible.builtin.debug:
    msg: >-
      Would install rsync during apply; application source synchronization is
      skipped in check mode because rsync is not available on the remote host.
  when:
    - ansible_check_mode
    - (application_remote_rsync.rc | default(1)) != 0

- name: Create application release directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user_name }}"
    group: www-data
    mode: "0755"
  loop:
    - "{{ application_root }}"
    - "{{ application_root }}/releases"
    - "{{ application_release_path }}"
    - "{{ application_shared_path }}"

- name: Inspect application release path
  ansible.builtin.stat:
    path: "{{ application_release_path }}"
  register: application_release_directory

- name: Report missing application release path during check mode
  ansible.builtin.debug:
    msg: >-
      Would create {{ application_release_path }} during apply; application
      source synchronization is skipped in check mode because the release
      directory does not exist yet.
  when:
    - ansible_check_mode
    - not (application_release_directory.stat.isdir | default(false))

- name: Create shared writable directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user_name }}"
    group: www-data
    mode: "2775"
  loop:
    - "{{ application_shared_path }}/storage/app"
    - "{{ application_shared_path }}/storage/framework/cache/data"
    - "{{ application_shared_path }}/storage/framework/sessions"
    - "{{ application_shared_path }}/storage/framework/views"
    - "{{ application_shared_path }}/storage/logs"
    - "{{ private_storage_path }}"

- name: Create Git checkout root on control node
  ansible.builtin.file:
    path: "{{ application_git_checkout_root }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  when: application_source_strategy == 'git'

- name: Checkout application release on control node
  ansible.builtin.git:
    repo: "{{ application_git_repo }}"
    dest: "{{ application_git_checkout_path }}"
    version: "{{ application_git_ref }}"
    key_file: "{{ application_git_key_file | default(omit, true) }}"
    accept_hostkey: "{{ application_git_accept_hostkey }}"
    force: true
  delegate_to: localhost
  become: false
  run_once: true
  when: application_source_strategy == 'git'

- name: Select application source path
  ansible.builtin.set_fact:
    application_effective_source_path: >-
      {{ application_git_checkout_path if application_source_strategy == 'git' else application_source_path }}

- name: Synchronize application source into release
  ansible.posix.synchronize:
    src: "{{ application_effective_source_path }}/"
    dest: "{{ application_release_path }}/"
    delete: false
    rsync_path: sudo -n rsync
    rsync_opts:
      - --timeout=120
      - --contimeout=30
      - --no-owner
      - --no-group
      - --no-perms
      - --omit-dir-times
      - "--chown={{ deploy_user_name }}:www-data"
      - --exclude=.git/
      - --exclude=.agents/
      - --exclude=.codex/
      - --exclude=.docker/
      - --exclude=.env
      - --exclude=deploy/
      - --exclude=docs/
      - --exclude=node_modules/
      - --exclude=plan_dev/
      - --exclude=storage
      - --exclude=bootstrap/cache
      - --exclude=tests/
      - --exclude=vendor/
      - --exclude=phpunit.xml
      - --exclude=.phpunit.result.cache
  when:
    - not ansible_check_mode or (application_remote_rsync.rc | default(1)) == 0
    - not ansible_check_mode or (application_release_directory.stat.isdir | default(false))

- name: Set release ownership
  ansible.builtin.file:
    path: "{{ application_release_path }}"
    state: directory
    owner: "{{ deploy_user_name }}"
    group: www-data
    mode: "0755"

- name: Link shared storage
  ansible.builtin.file:
    src: "{{ application_shared_path }}/storage"
    dest: "{{ application_release_path }}/storage"
    state: link
    owner: "{{ deploy_user_name }}"
    group: www-data
    force: true

- name: Ensure bootstrap cache permissions
  ansible.builtin.file:
    path: "{{ application_release_path }}/bootstrap/cache"
    state: directory
    owner: "{{ deploy_user_name }}"
    group: www-data
    mode: "2775"

- name: Render shared Laravel environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ application_shared_path }}/.env"
    owner: "{{ deploy_user_name }}"
    group: www-data
    mode: "0640"
  no_log: true

- name: Link shared Laravel environment
  ansible.builtin.file:
    src: "{{ application_shared_path }}/.env"
    dest: "{{ application_release_path }}/.env"
    state: link
    owner: "{{ deploy_user_name }}"
    group: www-data
    force: true

- name: Install production Composer dependencies
  community.general.composer:
    command: install
    working_dir: "{{ application_release_path }}"
    no_dev: true
    optimize_autoloader: true
    prefer_dist: true
  become: true
  become_user: "{{ deploy_user_name }}"
  when: not ansible_check_mode

- name: Run Laravel migrations
  ansible.builtin.command:
    argv:
      - php
      - artisan
      - migrate
      - --force
    chdir: "{{ application_release_path }}"
  become: true
  become_user: "{{ deploy_user_name }}"
  register: application_migrations
  changed_when: "'Nothing to migrate' not in application_migrations.stdout"
  run_once: true
  when: not ansible_check_mode

- name: Optimize Laravel caches
  ansible.builtin.command:
    argv:
      - php
      - artisan
      - optimize
    chdir: "{{ application_release_path }}"
  become: true
  become_user: "{{ deploy_user_name }}"
  changed_when: false
  when: not ansible_check_mode

- name: Read previously active application release
  ansible.builtin.command:
    argv: [readlink, -f, "{{ application_current_path }}"]
  register: application_previous_release
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Activate and validate application release
  when: not ansible_check_mode
  block:
    - name: Activate application release
      ansible.builtin.file:
        src: "{{ application_release_path }}"
        dest: "{{ application_current_path }}"
        state: link
        force: true
        owner: "{{ deploy_user_name }}"
        group: www-data

    - name: Reload PHP-FPM after release activation
      ansible.builtin.service:
        name: "php{{ php_version }}-fpm"
        state: reloaded

    - name: Validate activated release health endpoint
      ansible.builtin.uri:
        url: "{{ application_url }}/up"
        status_code: 200
        validate_certs: "{{ tls_enabled | default(false) }}"
        ca_path: "{{ tls_ca_certificate_path if (tls_provider | default('provided')) == 'local_ca' else omit }}"
        use_proxy: false

  rescue:
    - name: Restore previously active release
      ansible.builtin.file:
        src: "{{ application_previous_release.stdout }}"
        dest: "{{ application_current_path }}"
        state: link
        force: true
        owner: "{{ deploy_user_name }}"
        group: www-data
      when: application_previous_release.rc == 0

    - name: Remove failed first activation
      ansible.builtin.file:
        path: "{{ application_current_path }}"
        state: absent
      when: application_previous_release.rc != 0

    - name: Reload PHP-FPM after failed activation
      ansible.builtin.service:
        name: "php{{ php_version }}-fpm"
        state: reloaded

    - name: Report failed release activation
      ansible.builtin.fail:
        msg: >-
          The new release failed its health check and was deactivated.
          Database migrations are not rolled back automatically.
