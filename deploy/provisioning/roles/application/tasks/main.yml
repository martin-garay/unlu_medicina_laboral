---
- name: Validate application source strategy
  ansible.builtin.assert:
    that:
      - application_source_strategy in ['local', 'git']
      - application_transfer_strategy in ['rsync', 'archive']
      - application_composer_install_local is boolean
    fail_msg: >-
      Unsupported application source or transfer strategy:
      {{ application_source_strategy }} / {{ application_transfer_strategy }}.

- name: Select whether rsync capability is required
  ansible.builtin.set_fact:
    application_rsync_required: >-
      {{ application_transfer_strategy == 'rsync' }}
    application_archive_required: >-
      {{ application_transfer_strategy == 'archive'
         or application_composer_install_local | bool }}

- name: Install Composer
  ansible.builtin.apt:
    name: composer
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install rsync for application synchronization
  ansible.builtin.apt:
    name: rsync
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: application_rsync_required | bool

- name: Check remote rsync availability
  ansible.builtin.command:
    argv: [rsync, --version]
  register: application_remote_rsync
  changed_when: false
  failed_when: false
  check_mode: false
  when: application_rsync_required | bool

- name: Report missing remote rsync during check mode
  ansible.builtin.debug:
    msg: >-
      Would install rsync during apply; application source synchronization is
      skipped in check mode because rsync is not available on the remote host.
  when:
    - ansible_check_mode
    - application_rsync_required | bool
    - (application_remote_rsync.rc | default(1)) != 0

- name: Read active application release before synchronization
  ansible.builtin.command:
    argv: [readlink, -f, "{{ application_current_path }}"]
  register: application_active_release_before_sync
  changed_when: false
  failed_when: false
  when: application_clean_inactive_release_before_sync | bool

- name: Clean inactive application release path before synchronization
  ansible.builtin.file:
    path: "{{ application_release_path }}"
    state: absent
  when:
    - not ansible_check_mode
    - application_clean_inactive_release_before_sync | bool
    - application_active_release_before_sync.stdout | default('') != application_release_path

- name: Select whether application release needs transfer
  ansible.builtin.set_fact:
    application_should_transfer_release: >-
      {{
        (not (application_clean_inactive_release_before_sync | bool))
        or ((application_active_release_before_sync.stdout | default('')) != application_release_path)
      }}

- name: Create application release directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user_name }}"
    group: www-data
    mode: "0755"
  loop:
    - "{{ application_root }}"
    - "{{ application_root }}/releases"
    - "{{ application_release_path }}"
    - "{{ application_shared_path }}"

- name: Inspect application release path
  ansible.builtin.stat:
    path: "{{ application_release_path }}"
  register: application_release_directory

- name: Report missing application release path during check mode
  ansible.builtin.debug:
    msg: >-
      Would create {{ application_release_path }} during apply; application
      source synchronization is skipped in check mode because the release
      directory does not exist yet.
  when:
    - ansible_check_mode
    - not (application_release_directory.stat.isdir | default(false))

- name: Create shared writable directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user_name }}"
    group: www-data
    mode: "2775"
  loop:
    - "{{ application_shared_path }}/storage/app"
    - "{{ application_shared_path }}/storage/framework/cache/data"
    - "{{ application_shared_path }}/storage/framework/sessions"
    - "{{ application_shared_path }}/storage/framework/views"
    - "{{ application_shared_path }}/storage/logs"
    - "{{ private_storage_path }}"

- name: Create Git checkout root on control node
  ansible.builtin.file:
    path: "{{ application_git_checkout_root }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  when: application_source_strategy == 'git'

- name: Checkout application release on control node
  ansible.builtin.git:
    repo: "{{ application_git_repo }}"
    dest: "{{ application_git_checkout_path }}"
    version: "{{ application_git_ref }}"
    key_file: "{{ application_git_key_file | default(omit, true) }}"
    accept_hostkey: "{{ application_git_accept_hostkey }}"
    force: true
  delegate_to: localhost
  become: false
  run_once: true
  when: application_source_strategy == 'git'

- name: Select application source path
  ansible.builtin.set_fact:
    application_effective_source_path: >-
      {{ application_git_checkout_path if application_source_strategy == 'git' else application_source_path }}

- name: Check local rsync availability
  ansible.builtin.command:
    argv: [rsync, --version]
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  when: application_rsync_required | bool

- name: Inspect application source path on control node
  ansible.builtin.stat:
    path: "{{ application_effective_source_path }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: application_source_directory

- name: Inspect Laravel manifest on control node
  ansible.builtin.stat:
    path: "{{ application_effective_source_path }}/composer.json"
  delegate_to: localhost
  become: false
  run_once: true
  register: application_source_composer

- name: Require valid application source on control node
  ansible.builtin.assert:
    that:
      - application_source_directory.stat.isdir | default(false)
      - application_source_composer.stat.exists | default(false)
    fail_msg: >-
      Application source path {{ application_effective_source_path }} must exist
      on the control node and contain composer.json before synchronization.
  run_once: true

- name: Check remote privileged rsync availability
  ansible.builtin.command:
    argv: [/usr/bin/sudo, -n, /usr/bin/rsync, --version]
  become: false
  register: application_remote_privileged_rsync
  changed_when: false
  failed_when: false
  check_mode: false
  when: application_rsync_required | bool

- name: Report unavailable remote privileged rsync during check mode
  ansible.builtin.debug:
    msg: >-
      Would require passwordless sudo for remote rsync during apply; application
      source synchronization is skipped in check mode because `sudo -n rsync`
      is not available.
  when:
    - ansible_check_mode
    - application_rsync_required | bool
    - (application_remote_privileged_rsync.rc | default(1)) != 0

- name: Require remote privileged rsync during apply
  ansible.builtin.assert:
    that:
      - (application_remote_privileged_rsync.rc | default(1)) == 0
    fail_msg: >-
      Remote synchronization requires passwordless sudo for /usr/bin/rsync.
      Check result: rc={{ application_remote_privileged_rsync.rc | default('not-run') }},
      stdout={{ application_remote_privileged_rsync.stdout | default('') | trim }},
      stderr={{ application_remote_privileged_rsync.stderr | default('') | trim }}.
      Validate `ssh -i ../.local/ssh/deploy_ed25519
      deploy@unlu-medicina-testing '/usr/bin/sudo -n /usr/bin/rsync --version'`.
  when:
    - not ansible_check_mode
    - application_rsync_required | bool

- name: Create application artifact root on control node
  ansible.builtin.file:
    path: "{{ application_artifact_root }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  when: application_archive_required | bool

- name: Check local tar availability
  ansible.builtin.command:
    argv: [tar, --version]
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  when: application_archive_required | bool

- name: Check remote tar availability
  ansible.builtin.command:
    argv: [tar, --version]
  register: application_remote_tar
  changed_when: false
  failed_when: false
  check_mode: false
  when: application_archive_required | bool

- name: Require remote tar during apply
  ansible.builtin.assert:
    that:
      - (application_remote_tar.rc | default(1)) == 0
    fail_msg: "Remote archive extraction requires tar on the target host."
  when:
    - not ansible_check_mode
    - application_archive_required | bool

- name: Build application artifact on control node
  ansible.builtin.command:
    cmd: >-
      tar --create --gzip
      --file {{ application_artifact_path | quote }}
      --directory {{ application_effective_source_path | quote }}
      {% for excluded_path in application_source_excludes %}
      --exclude={{ excluded_path | quote }}
      {% endfor %}
      .
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when:
    - not ansible_check_mode
    - application_transfer_strategy == 'archive'
    - application_should_transfer_release | bool
  tags:
    - skip_ansible_lint

- name: Copy application artifact to target
  ansible.builtin.copy:
    src: "{{ application_artifact_path }}"
    dest: "{{ application_artifact_remote_path }}"
    owner: "{{ deploy_user_name }}"
    group: "{{ deploy_user_group }}"
    mode: "0600"
  when:
    - not ansible_check_mode
    - application_transfer_strategy == 'archive'
    - application_should_transfer_release | bool

- name: Extract application artifact into release
  ansible.builtin.unarchive:
    src: "{{ application_artifact_remote_path }}"
    dest: "{{ application_release_path }}"
    remote_src: true
    owner: "{{ deploy_user_name }}"
    group: www-data
  when:
    - not ansible_check_mode
    - application_transfer_strategy == 'archive'
    - application_should_transfer_release | bool

- name: Remove remote application artifact
  ansible.builtin.file:
    path: "{{ application_artifact_remote_path }}"
    state: absent
  when:
    - not ansible_check_mode
    - application_transfer_strategy == 'archive'
    - application_should_transfer_release | bool

- name: Synchronize application source into release
  ansible.posix.synchronize:
    src: "{{ application_effective_source_path }}/"
    dest: "{{ application_release_path }}/"
    delete: false
    rsync_path: sudo -n rsync
    rsync_opts:
      - --timeout=120
      - --no-owner
      - --no-group
      - --no-perms
      - --omit-dir-times
      - "--chown={{ deploy_user_name }}:www-data"
      - --exclude=.git
      - --exclude=.agents
      - --exclude=.codex
      - --exclude=.docker
      - --exclude=.env
      - --exclude=deploy
      - --exclude=docs
      - --exclude=node_modules
      - --exclude=plan_dev
      - --exclude=storage
      - --exclude=bootstrap/cache
      - --exclude=tests
      - --exclude=vendor
      - --exclude=phpunit.xml
      - --exclude=.phpunit.result.cache
  when:
    - application_transfer_strategy == 'rsync'
    - application_should_transfer_release | bool
    - not ansible_check_mode or (application_remote_rsync.rc | default(1)) == 0
    - not ansible_check_mode or (application_release_directory.stat.isdir | default(false))
    - not ansible_check_mode or (application_remote_privileged_rsync.rc | default(1)) == 0

- name: Check Docker availability for local Composer build
  ansible.builtin.command:
    argv: [docker, version]
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  when: application_composer_install_local | bool

- name: Read control node user id for local Composer build
  ansible.builtin.command:
    argv: [id, -u]
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  register: application_control_uid
  when: application_composer_install_local | bool

- name: Read control node group id for local Composer build
  ansible.builtin.command:
    argv: [id, -g]
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  register: application_control_gid
  when: application_composer_install_local | bool

- name: Create Laravel writable directories for local Composer scripts
  ansible.builtin.file:
    path: "{{ application_effective_source_path }}/{{ item }}"
    state: directory
    mode: "0775"
  loop:
    - bootstrap/cache
    - storage/framework/cache/data
    - storage/framework/sessions
    - storage/framework/views
    - storage/logs
  delegate_to: localhost
  become: false
  run_once: true
  when: application_composer_install_local | bool

- name: Build local Composer image from selected release
  ansible.builtin.command:
    argv:
      - docker
      - build
      - --tag
      - medicina-laboral-composer-control:latest
      - --build-arg
      - "UID={{ application_control_uid.stdout }}"
      - --build-arg
      - "GID={{ application_control_gid.stdout }}"
      - --build-arg
      - http_proxy
      - --build-arg
      - https_proxy
      - --build-arg
      - no_proxy
      - --file
      - "{{ application_effective_source_path }}/docker/app/Dockerfile"
      - "{{ application_effective_source_path }}"
  environment:
    http_proxy: "{{ application_control_http_proxy }}"
    https_proxy: "{{ application_control_https_proxy }}"
    no_proxy: "{{ application_control_no_proxy }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when:
    - not ansible_check_mode
    - application_composer_install_local | bool
    - application_should_transfer_release | bool

- name: Install production Composer dependencies on control node
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --user
      - "{{ application_control_uid.stdout }}:{{ application_control_gid.stdout }}"
      - --env
      - http_proxy
      - --env
      - https_proxy
      - --env
      - no_proxy
      - --volume
      - "{{ application_effective_source_path }}:/var/www/html"
      - --workdir
      - /var/www/html
      - medicina-laboral-composer-control:latest
      - composer
      - install
      - --no-dev
      - --prefer-dist
      - --optimize-autoloader
      - --no-interaction
      - --no-progress
  environment:
    http_proxy: "{{ application_control_http_proxy }}"
    https_proxy: "{{ application_control_https_proxy }}"
    no_proxy: "{{ application_control_no_proxy }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when:
    - not ansible_check_mode
    - application_composer_install_local | bool
    - application_should_transfer_release | bool

- name: Build local Composer vendor artifact
  ansible.builtin.command:
    argv:
      - tar
      - --create
      - --gzip
      - --file
      - "{{ application_vendor_artifact_path }}"
      - --directory
      - "{{ application_effective_source_path }}"
      - vendor
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when:
    - not ansible_check_mode
    - application_composer_install_local | bool
    - application_should_transfer_release | bool

- name: Copy local Composer vendor artifact to target
  ansible.builtin.copy:
    src: "{{ application_vendor_artifact_path }}"
    dest: "{{ application_vendor_artifact_remote_path }}"
    owner: "{{ deploy_user_name }}"
    group: "{{ deploy_user_group }}"
    mode: "0600"
  when:
    - not ansible_check_mode
    - application_composer_install_local | bool
    - application_should_transfer_release | bool

- name: Extract local Composer dependencies into release
  ansible.builtin.unarchive:
    src: "{{ application_vendor_artifact_remote_path }}"
    dest: "{{ application_release_path }}"
    remote_src: true
    owner: "{{ deploy_user_name }}"
    group: www-data
  when:
    - not ansible_check_mode
    - application_composer_install_local | bool
    - application_should_transfer_release | bool

- name: Remove remote Composer vendor artifact
  ansible.builtin.file:
    path: "{{ application_vendor_artifact_remote_path }}"
    state: absent
  when:
    - not ansible_check_mode
    - application_composer_install_local | bool
    - application_should_transfer_release | bool

- name: Set release ownership
  ansible.builtin.file:
    path: "{{ application_release_path }}"
    state: directory
    owner: "{{ deploy_user_name }}"
    group: www-data
    mode: "0755"

- name: Link shared storage
  ansible.builtin.file:
    src: "{{ application_shared_path }}/storage"
    dest: "{{ application_release_path }}/storage"
    state: link
    owner: "{{ deploy_user_name }}"
    group: www-data
    force: true

- name: Ensure bootstrap cache permissions
  ansible.builtin.file:
    path: "{{ application_release_path }}/bootstrap/cache"
    state: directory
    owner: "{{ deploy_user_name }}"
    group: www-data
    mode: "2775"

- name: Render shared Laravel environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ application_shared_path }}/.env"
    owner: "{{ deploy_user_name }}"
    group: www-data
    mode: "0640"
  no_log: true

- name: Link shared Laravel environment
  ansible.builtin.file:
    src: "{{ application_shared_path }}/.env"
    dest: "{{ application_release_path }}/.env"
    state: link
    owner: "{{ deploy_user_name }}"
    group: www-data
    force: true

- name: Install production Composer dependencies
  community.general.composer:
    command: install
    working_dir: "{{ application_release_path }}"
    no_dev: true
    optimize_autoloader: true
    prefer_dist: true
  become: true
  become_user: "{{ deploy_user_name }}"
  when:
    - not ansible_check_mode
    - not application_composer_install_local | bool

- name: Validate locally built Composer platform requirements
  ansible.builtin.command:
    argv:
      - composer
      - check-platform-reqs
      - --no-dev
    chdir: "{{ application_release_path }}"
  become: true
  become_user: "{{ deploy_user_name }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - application_composer_install_local | bool

- name: Run Laravel migrations
  ansible.builtin.command:
    argv:
      - php
      - artisan
      - migrate
      - --force
    chdir: "{{ application_release_path }}"
  become: true
  become_user: "{{ deploy_user_name }}"
  register: application_migrations
  changed_when: "'Nothing to migrate' not in application_migrations.stdout"
  run_once: true
  when: not ansible_check_mode

- name: Optimize Laravel caches
  ansible.builtin.command:
    argv:
      - php
      - artisan
      - optimize
    chdir: "{{ application_release_path }}"
  become: true
  become_user: "{{ deploy_user_name }}"
  changed_when: false
  when: not ansible_check_mode

- name: Read previously active application release
  ansible.builtin.command:
    argv: [readlink, -f, "{{ application_current_path }}"]
  register: application_previous_release
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Inspect previously active application release
  ansible.builtin.stat:
    path: "{{ application_previous_release.stdout }}"
  register: application_previous_release_path
  when:
    - not ansible_check_mode
    - application_previous_release.rc == 0
    - application_previous_release.stdout | length > 0
    - application_previous_release.stdout != application_current_path

- name: Validate previously active application release
  ansible.builtin.set_fact:
    application_previous_release_valid: >-
      {{
        application_previous_release.rc == 0
        and application_previous_release.stdout | length > 0
        and application_previous_release.stdout != application_current_path
        and application_previous_release.stdout.startswith(
          application_root ~ '/releases/'
        )
        and application_previous_release_path.stat.exists | default(false)
        and application_previous_release_path.stat.isdir | default(false)
      }}
  when: not ansible_check_mode

- name: Activate and validate application release
  when: not ansible_check_mode
  block:
    - name: Activate application release
      ansible.builtin.file:
        src: "{{ application_release_path }}"
        dest: "{{ application_current_path }}"
        state: link
        force: true
        follow: false
        owner: "{{ deploy_user_name }}"
        group: www-data

    - name: Reload PHP-FPM after release activation
      ansible.builtin.service:
        name: "php{{ php_version }}-fpm"
        state: reloaded

    - name: Validate activated release health endpoint
      ansible.builtin.command:
        argv: >-
          {{
            [
              'curl', '--silent', '--show-error', '--fail', '--location',
              '--output', '/dev/null', '--write-out', '%{http_code}',
              '--connect-timeout', '10', '--max-time', '30',
              '--noproxy', '*'
            ]
            + (
              [] if tls_enabled | default(false) | bool
              else ['--insecure']
            )
            + (
              ['--cacert', tls_ca_certificate_path]
              if (
                tls_enabled | default(false) | bool
                and tls_provider | default('provided') == 'local_ca'
              )
              else []
            )
            + [application_url ~ '/up']
          }}
      register: application_health_check
      changed_when: false
      retries: 5
      delay: 2
      until:
        - application_health_check.rc == 0
        - application_health_check.stdout == '200'

  rescue:
    - name: Restore previously active release
      ansible.builtin.file:
        src: "{{ application_previous_release.stdout }}"
        dest: "{{ application_current_path }}"
        state: link
        force: true
        follow: false
        owner: "{{ deploy_user_name }}"
        group: www-data
      when: application_previous_release_valid | bool

    - name: Remove failed first activation
      ansible.builtin.file:
        path: "{{ application_current_path }}"
        state: absent
      when: not application_previous_release_valid | bool

    - name: Reload PHP-FPM after failed activation
      ansible.builtin.service:
        name: "php{{ php_version }}-fpm"
        state: reloaded

    - name: Report failed release activation
      ansible.builtin.fail:
        msg: >-
          The new release failed its health check and was deactivated.
          Database migrations are not rolled back automatically.
