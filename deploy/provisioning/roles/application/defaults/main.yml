---
# Supported values:
# - local: sync the current workspace; intended for Vagrant/dev.
# - git: checkout an immutable tag/SHA on the control node and sync it.
# Future option:
# - artifact: CI-built package with checksum; not implemented yet.
application_source_strategy: local
application_transfer_strategy: rsync
# Build production Composer dependencies on the Ansible control node when the
# managed host has no outbound access to Packagist/GitHub. The build uses the
# Dockerfile from the exact source checkout selected by application_git_ref,
# then synchronizes vendor/ only into that same application_release_path.
# Keep false when the managed host can run Composer with outbound HTTPS.
application_composer_install_local: false
# Proxy values for Docker on the Ansible control node. Lowercase variables are
# preferred because Composer/curl use them in PC Uni; uppercase variants remain
# supported as fallback. Values come from the operator environment and are not
# hardcoded in inventories or committed with institutional credentials.
application_control_http_proxy: >-
  {{ lookup('ansible.builtin.env', 'http_proxy')
     or lookup('ansible.builtin.env', 'HTTP_PROXY') }}
application_control_https_proxy: >-
  {{ lookup('ansible.builtin.env', 'https_proxy')
     or lookup('ansible.builtin.env', 'HTTPS_PROXY') }}
application_control_no_proxy: >-
  {{ lookup('ansible.builtin.env', 'no_proxy')
     or lookup('ansible.builtin.env', 'NO_PROXY') }}
application_source_path: "{{ playbook_dir }}/../../.."
application_git_repo: git@github.com:martin-garay/unlu_medicina_laboral.git
application_git_ref: "{{ application_release_id }}"
application_git_checkout_root: "{{ playbook_dir }}/../.local/releases"
application_git_checkout_path: "{{ application_git_checkout_root }}/{{ application_release_id }}"
application_git_key_file: ""
application_git_accept_hostkey: false
application_artifact_root: "{{ playbook_dir }}/../.local/artifacts"
application_artifact_path: "{{ application_artifact_root }}/{{ application_release_id }}.tar.gz"
application_artifact_remote_path: "/tmp/{{ application_name }}-{{ application_release_id }}.tar.gz"
application_release_path: "{{ application_root }}/releases/{{ application_release_id }}"
application_shared_path: "{{ application_root }}/shared"
application_current_path: "{{ application_root }}/current"
# Cleans a failed or stale inactive release directory before transferring
# source. The active release pointed by application_current_path is never removed.
application_clean_inactive_release_before_sync: true
application_source_excludes:
  - .git
  - .agents
  - .codex
  - .docker
  - .env
  - deploy
  - docs
  - node_modules
  - plan_dev
  - storage
  - bootstrap/cache
  - tests
  - vendor
  - phpunit.xml
  - .phpunit.result.cache

application_db_host: 127.0.0.1
application_db_port: 5432
application_log_level: info
